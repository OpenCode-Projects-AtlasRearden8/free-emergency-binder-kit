name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NAME: ${{ github.event.repository.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install WeasyPrint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu
          pip install weasyprint pypdf pytest
      - name: Build and test PDFs
        run: |
          python build.py
          python -m pytest -q tests
      - name: Package
        run: |
          mkdir release
          cp dist/*.pdf release/
          cd dist && zip -q "../release/$NAME-$TAG-all-pdfs.zip" *.pdf
      - name: Publish GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$NAME $TAG" --generate-notes --verify-tag
          fi
